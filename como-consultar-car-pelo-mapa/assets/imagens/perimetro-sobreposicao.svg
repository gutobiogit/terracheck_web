<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="t d"><title id="t">Sobreposição conceitual entre cadastros</title><desc id="d">Dois perímetros fictícios se cruzam, com interseção destacada em vermelho.</desc><rect width="960" height="570" rx="20" fill="#f5f8f0"/><g stroke="#d8e5d9" stroke-width="2"><path d="M0 95H960M0 190H960M0 285H960M0 380H960M0 475H960M120 0V570M240 0V570M360 0V570M480 0V570M600 0V570M720 0V570M840 0V570"/></g><path d="M105 160L425 100L570 215L535 460L170 475L90 335Z" fill="#70b98f" fill-opacity=".45" stroke="#187348" stroke-width="6"/><path d="M445 85L820 125L865 410L560 490L400 305Z" fill="#e2c564" fill-opacity=".45" stroke="#ae8a19" stroke-width="6"/><path d="M445 85L570 215L535 460L400 305Z" fill="#de6461" fill-opacity=".65" stroke="#ba4443" stroke-width="3"/><rect x="55" y="25" width="390" height="50" rx="12" fill="#fff"/><text x="77" y="57" fill="#183a2e" font-family="Arial" font-size="23" font-weight="700">Interseção geométrica didática</text><g font-family="Arial" font-size="22" font-weight="700"><text x="185" y="290" fill="#135a38">CAR A</text><text x="680" y="290" fill="#83630a">CAR B</text><text x="460" y="273" fill="#8f2f31" font-size="17">Área em</text><text x="457" y="294" fill="#8f2f31" font-size="17">comum</text></g><text x="52" y="538" font-family="Arial" fill="#687c70" font-size="18">Esquema fictício, sem escala; interseção não comprova invasão.</text></svg>
